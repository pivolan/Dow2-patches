[Reverse]
; hold this key and right-click the ground: back off toward the point, vehicles drive backwards (Ctrl, Alt or a virtual key code)
Key=Ctrl
; one leg of the way, 5..30 m (the game plans driving backwards up to 30 m)
StepMeters=25
; the next leg this many meters before the end of the current one, while still moving: no stop between legs (0 = wait for the stop)
LeadMeters=8
