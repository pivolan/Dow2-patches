[MatchTimer]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
; position of the clock in percent of the screen: X from the left edge, Y from the top edge
X=50
Y=8
; which point of the clock sits at X: 0 = its left edge, 1 = its centre, 2 = its right edge
Align=1
; text height in pixels at 1080p, scaled with the screen height
Size=22
; colours RRGGBB: text and its outline
Color=FFFFFF
Outline=000000
; 0 = in every game: multiplayer, offline vs AI and replays; 1 = only in live multiplayer matches
OnlineOnly=0
; hide the clock when the simulation has stood still this many seconds (post-game screen, long lag)
HideAfterSec=5
; no simulation tick for this many seconds = the next tick starts a new match (the clock starts from 00:00)
NewMatchGapSec=60
