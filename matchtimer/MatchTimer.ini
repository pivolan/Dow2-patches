[MatchTimer]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
; 2 = in a box left of the Menu button, drawn like the game's own boxes (the replay panel)
; 1 = the same place, text only; 0 = anywhere on the screen at X/Y
Style=1
; font of the clock: Arial is the replay timer's look; "Caslon Antique New" is the game's own (titles, campaign
; timers), read from the game's files at start (Book Antiqua if that fails), digits only
Font=Caslon Antique New
; 1 = bold
Bold=0
; 1 = the game's own text shadow (as on the replay timer and the campaign objectives), 0 = none
Shadow=1
; text height in pixels at 1080p, scaled with the screen height
Size=25
; colours RRGGBB: text and its outline (empty = no outline; a soft half-transparent halo in Style=1/2)
Color=FFFFFF
Outline=
; how solid the outline is in Style=1/2, 0..255: 144 = a soft halo, 255 = crisp, like the campaign objective timers
OutlineAlpha=160

; --- Style=1/2: in 1/1000 of the screen height, so it stays at the button on any resolution.
; right edge of the clock from the right edge of the screen (the Menu button starts at about 124)
MenuX=131
; middle of the clock from the top of the screen (the middle of the Menu button)
MenuY=18
; 0 = left of the Menu button (MenuX), 1 = right of the victory points bar in the centre (VpX), 2 = above the minimap
Anchor=2
; left edge of the clock from the centre of the screen (the VP bar ends at about 118)
VpX=126
; Anchor=2: left edge of the clock from the left edge of the screen, its middle above the bottom edge
MapX=7
MapY=239

; --- Style=0: position in percent of the screen: X from the left edge, Y from the top edge
X=50
Y=8
; which point of the clock sits at X: 0 = its left edge, 1 = its centre, 2 = its right edge
Align=1

; 0 = in every game: multiplayer, offline vs AI and replays; 1 = only in live multiplayer matches
OnlineOnly=0

