[MatchTimer]
; 1 = on, 0 = off (0 at game start: the DLL stays idle until the next start)
Enabled=1
; Changes below are picked up while the game runs, within a second: edit, save, look.
; 1 = a panel docked to the right of the victory points bar (top centre), 0 = plain text with an outline at X/Y
Style=1
; font of the clock (the game's own Caslon Antique is inside its Flash files, Book Antiqua is the closest in Windows)
Font=Book Antiqua
; 1 = bold
Bold=0
; text height in pixels at 1080p, scaled with the screen height
Size=22
; colours RRGGBB: text and its shadow (outline in Style=0)
Color=E8E4D8
Outline=000000

; --- Style=1: the panel. Sizes in 1/1000 of the screen height, so it stays at the bar on any resolution.
; left edge of the panel from the screen centre (the bar ends at about 118)
PanelX=119
; top edge from the top of the screen
PanelY=0
; width (grows by itself for 1:02:34) and height (the bar is about 34)
PanelW=75
PanelH=34
; colours RRGGBB: fill and frame
Panel=12171B
Border=5A8797

; --- Style=0: plain text. Position in percent of the screen: X from the left edge, Y from the top edge
X=50
Y=8
; which point of the clock sits at X: 0 = its left edge, 1 = its centre, 2 = its right edge
Align=1

; 0 = in every game: multiplayer, offline vs AI and replays; 1 = only in live multiplayer matches
OnlineOnly=0
; hide the clock when the simulation has stood still this many seconds (post-game screen, long lag)
HideAfterSec=5
; no simulation tick for this many seconds = the next tick starts a new match (the clock starts from 00:00)
NewMatchGapSec=60
