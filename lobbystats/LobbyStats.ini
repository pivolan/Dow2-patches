[LobbyStats]
; 1 = Relic rating and stats in the lobby (names and hover tooltips), 0 = off
Stats=1
; 1 = rating after the name in the lobby, 0 = only in the hover tooltip
ShowRatingInName=1
; stats service host (no https://, no path). Empty = the one baked in at build time (rts.fintebtc.de)
;Server=

[Debug]
; 1 = write LobbyStats_invoke.log: every Flash function the game calls (lobby, loading screen, HUD) with its
; arguments, and once a minute how often each one was called. For finding UI functions; leave 0 otherwise.
LogInvoke=0

[MenuTooltip]
; the stats tooltip over your rating in the main menu covers the game's own one ("Currently logged in player");
; in 1/1000 of the screen height: its right edge and top relative to the cursor, and its least width
DX=3
DY=4
MinWidth=300

[MatchTimer]
; match clock (MM:SS of game time) above the minimap, in the game font; 1 = on, 0 = off. The look: see matchtimer/MatchTimer.ini
Enabled=1

[LoadingScreen]
; 1 = a box with everyone's Relic rating on the loading screen of an online match (the players of the last lobby, by team)
Ratings=0
