[LobbyStats]
; 1 = Relic rating and stats in the lobby (names and hover tooltips), 0 = off
Stats=1
; 1 = rating after the name in the lobby, 0 = only in the hover tooltip
ShowRatingInName=1
; stats service host (no https://, no path). Empty = the one baked in at build time (make STATS_HOST=...);
; with neither there are no numbers at all.
;Server=

[Debug]
; 1 = write LobbyStats_invoke.log: every Flash function the game calls (lobby, loading screen, HUD) with its
; arguments, and once a minute how often each one was called. For finding UI functions; leave 0 otherwise.
LogInvoke=0
